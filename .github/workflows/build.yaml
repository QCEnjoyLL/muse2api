name: build-image

# 本仓库只维护构建流水线，源码每次从上游 czg86389-hub/muse2api 实时拉取。
# 触发方式：每周一北京时间 09:00 自动构建；或到 Actions 页面手动 Run workflow。

on:
  schedule:
    - cron: '0 1 * * 1'      # UTC 周一 01:00 = 北京时间周一 09:00
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取上游代码
        uses: actions/checkout@v4
        with:
          repository: czg86389-hub/muse2api
          ref: main
          fetch-depth: 1

      - name: 解析镜像名 / 版本号
        id: info
        run: |
          # GHCR 镜像名必须全小写，GitHub 用户名可能含大写
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // "0.0.0"' version.json 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "upsha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "上游版本 v$(jq -r '.version' version.json) / commit $(git rev-parse --short=7 HEAD)"

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:v${{ steps.info.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:sha-${{ steps.info.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.info.outputs.upsha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入运行摘要
        run: |
          {
            echo "### muse2api 镜像构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | \`v${{ steps.info.outputs.version }}\` |"
            echo "| 上游 commit | \`${{ steps.info.outputs.short }}\` |"
            echo "| 镜像 | \`${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
