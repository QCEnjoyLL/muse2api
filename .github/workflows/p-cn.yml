name: p-cn
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
concurrency:
  group: build-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout upstream
        uses: actions/checkout@v4
        with:
          repository: czg86389-hub/muse2api
          ref: main
          fetch-depth: 1
      - name: meta
        id: info
        run: |
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // "0.0.0"' version.json 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "upsha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: buildx
        uses: docker/setup-buildx-action@v3
      - name: login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:v${{ steps.info.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.info.outputs.image }}:sha-${{ steps.info.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.info.outputs.upsha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: summary
        run: |
          {
            echo "done"
            echo "| version | ${{ steps.info.outputs.version }} |"
          } >> "$GITHUB_STEP_SUMMARY"
